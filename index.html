<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Entrasol</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="home-hero">


    <div class="hero-content">

      <img src="assets/entrasol-text-blue.png" alt="Logo Entrasol" class="brand-logo">

      <h1 class="game-title">Memory Challenge</h1>
      <p class="game-subtitle">Hadapi 3 tantangan seru yang akan menguji daya ingat, fokus, dan ketelitianmu!</p>

      <ul class="game-list list-unstyled">
        <li class="game-item game-item--flip">
          <img class="game-item__icon" src="assets/icon-game-1.svg" alt="Ikon Memory Flip">
          <span class="game-item__sep game-item__sep--flip" aria-hidden="true"></span>
          <span class="game-item__num game-item__num--flip">01</span>
          <span class="game-item__name">Memory Flip</span>
        </li>
        <li class="game-item game-item--recall">
          <img class="game-item__icon" src="assets/icon-game-2.svg" alt="Ikon Memory Recall">
          <span class="game-item__sep game-item__sep--recall" aria-hidden="true"></span>
          <span class="game-item__num game-item__num--recall">02</span>
          <span class="game-item__name">Memory Recall</span>
        </li>
        <li class="game-item game-item--memorize">
          <img class="game-item__icon" src="assets/icon-game-3.svg" alt="Ikon Memorize, Shuffle & Recall">
          <span class="game-item__sep game-item__sep--memorize" aria-hidden="true"></span>
          <span class="game-item__num game-item__num--memorize">03</span>
          <span class="game-item__name">Memorize, Shuffle &amp; Recall</span>
        </li>
      </ul>

      <button type="button" id="startBtn" class="btn btn-entrasol hero-start">Mulai Permainan</button>

      <div class="hero-footer">
        <small class="hero-footer__label">Dipersembahkan oleh</small>
        <img src="assets/logo-kalbe.png" alt="Logo Kalbe Nutritionals" class="footer-logo">
      </div>

    </div>
  </main>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script>
    // Sesi baru (tidak ada state game-1): reset skor. Bila state ada
    // (playing/finished), lanjut tanpa reset agar game tidak bisa diulang.
    (function () {
      var btn = document.getElementById('startBtn');
      btn.addEventListener('click', function () {
        var state = null;
        try {
          if (typeof loadGame1State === 'function') state = loadGame1State();
        } catch (e) { state = null; }
        if (state === null || state === undefined) {
          try { resetScore(); } catch (e) {}
        }
        window.location.href = 'game-1/index.html';
      });
    })();
  </script>
</body>
</html>
