
<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Ulang QR Code - Entrasol</title>

  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #EAF5FC, #FFFFFF);
      font-family: "Noto Sans", sans-serif;
      text-align: center;
      color: #174B7A;
    }

    .message-card {
      width: 100%;
      max-width: 420px;
      padding: 40px 28px;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(23, 75, 122, 0.10);
    }

    .message-icon {
      font-size: 52px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      margin: 0;
    }
  </style>
</head>

<body>
  <main class="message-card">
    <div class="message-icon">📱</div>

    <h1>Permainan Telah Selesai</h1>

    <p>
      Silakan scan ulang QR Code yang tersedia pada booth Entrasol
      untuk memulai permainan baru.
    </p>
  </main>
</body>
</html>
